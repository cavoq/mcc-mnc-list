name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/release.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release tag
        id: release
        run: node scripts/check-release.js
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Publish tagged package
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"
        env:
          # Optional bootstrap/fallback; otherwise npm uses OIDC trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
